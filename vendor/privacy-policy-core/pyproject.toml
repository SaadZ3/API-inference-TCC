[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-policy-core"
version = "0.1.0"
description = "Tratamento e treinamento de políticas de privacidade do TCC"
requires-python = ">=3.11,<3.14"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers==4.57.6"]

[tool.setuptools]
packages = ["tratamento", "privacy_pipeline"]
include-package-data = false

[tool.setuptools.package-dir]
tratamento = "Tratamento/tratamento"
privacy_pipeline = "Treinamento/privacy_pipeline"

[tool.pytest.ini_options]
testpaths = ["Tratamento/tests", "Treinamento/tests"]
pythonpath = ["Tratamento", "Treinamento"]
addopts = "-q"
