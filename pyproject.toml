[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-policy-service"
version = "0.4.0"
description = "Serviço interno de análise de políticas do TCC"
requires-python = ">=3.11,<3.14"
dependencies = [
  "privacy-policy-core==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
  "pypdf>=6.19,<7",
  "pdfplumber==0.11.9",
  "transformers==4.57.6",
  "torch==2.14.0",
  "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
where = ["src"]
